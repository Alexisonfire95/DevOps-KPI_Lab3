services:
  db:
    image: postgres:17-alpine
    container_name: mywebapp-db
    environment:
      POSTGRES_USER: ${DB_USER:-mywebapp}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-mywebapp_password}
      POSTGRES_DB: ${DB_NAME:-mywebapp}
    volumes:
      - mywebapp-db-data:/var/lib/postgresql/data
    networks:
      - mywebapp-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mywebapp-app
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: ${DB_USER:-mywebapp}
      DB_PASSWORD: ${DB_PASSWORD:-mywebapp_password}
      DB_NAME: ${DB_NAME:-mywebapp}
      APP_PORT: 5200
      APP_HOST: 0.0.0.0
    networks:
      - mywebapp-net
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:5200/health/alive"]
      interval: 5s
      timeout: 3s
      retries: 3
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    container_name: mywebapp-nginx
    ports:
      - "8080:80"
    volumes:
      - ./deploy/nginx/mywebapp-docker.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - mywebapp-net
    depends_on:
      web:
        condition: service_healthy
    restart: unless-stopped

networks:
  mywebapp-net:
    name: mywebapp-net
    driver: bridge

volumes:
  mywebapp-db-data:
    name: mywebapp-db-data
